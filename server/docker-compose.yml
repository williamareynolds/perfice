# Deployment reference for the four backend services.
#
# Values here are placeholders. Two of them are not optional to change:
#
#   INTERNAL_SECRET   Must be the same across all four services, and secret.
#                     Only the gateway authenticates; the others trust the
#                     X-Userid / X-Sessionid headers it injects, and this
#                     header is what proves a request came through it. A
#                     backend reachable without it is account impersonation.
#   ENCRYPTION_KEY    Exactly 32 bytes. Encrypts provider OAuth tokens and
#                     fetched payloads at rest. Changing it makes existing
#                     credentials undecryptable.
#
# Note also that **only the gateway publishes a port**. That is the whole
# security model: the backends are reachable on the `perfice` network only.
# Publishing one of them would expose a service that accepts identity headers
# at face value.
#
# MONGO_URL points at a Mongo you run yourself. It must be a replica set --
# sync uses a transaction, which a standalone mongod refuses.

networks:
  perfice:
    driver: bridge

volumes:
  rabbitmq:

services:
  auth:
    image: ghcr.io/p0lloc/perfice_auth:latest
    container_name: auth
    environment:
      INTERNAL_SECRET: CHANGE_ME_SHARED_GATEWAY_SECRET
      GRPC_PORT: 5001
      HTTP_PORT: 8081
      MONGO_URL: mongodb://host.docker.internal:27017/?replicaSet=rs0
      JWT_SECRET: CHANGE_ME
      RABBITMQ_URL: amqp://perfice:CHANGE_ME@rabbitmq:5672/%2f
      BACKEND_BASE_URL: https://backend.example.com
      APP_BASE_URL: https://app.example.com/new
      # MAILEROO_API_KEY unset: with no mail service, email confirmation is
      # skipped and the password-reset routes answer 400.
      RUST_LOG: info
    networks:
      - perfice
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  sync:
    image: ghcr.io/p0lloc/perfice_sync:latest
    container_name: sync
    environment:
      INTERNAL_SECRET: CHANGE_ME_SHARED_GATEWAY_SECRET
      PORT: 8082
      MONGO_URL: mongodb://host.docker.internal:27017/?replicaSet=rs0
      AUTH_GRPC_URL: auth:5001
      RABBITMQ_URL: amqp://perfice:CHANGE_ME@rabbitmq:5672/%2f
      RUST_LOG: info
    networks:
      - perfice
    depends_on:
      auth:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  integration:
    image: ghcr.io/p0lloc/perfice_integration:latest
    container_name: integration
    environment:
      INTERNAL_SECRET: CHANGE_ME_SHARED_GATEWAY_SECRET
      PORT: 8080
      MONGO_URL: mongodb://host.docker.internal:27017/?replicaSet=rs0
      AUTH_GRPC_URL: auth:5001
      RABBITMQ_URL: amqp://perfice:CHANGE_ME@rabbitmq:5672/%2f
      # Where providers redirect a browser back to after authorization, so it
      # must be the public gateway origin rather than anything internal.
      CALLBACK_URL_BASE: https://backend.example.com
      ENCRYPTION_KEY: CHANGE_ME_EXACTLY_32_BYTES_LONG_
      RUST_LOG: info
    networks:
      - perfice
    depends_on:
      auth:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # The only service with a published port.
  gateway:
    image: ghcr.io/p0lloc/perfice_gateway:latest
    container_name: gateway
    ports:
      - "3000:3000"
    environment:
      INTERNAL_SECRET: CHANGE_ME_SHARED_GATEWAY_SECRET
      PORT: 3000
      AUTH_GRPC_URL: auth:5001
      AUTH_HTTP_URL: http://auth:8081
      SYNC_URL: http://sync:8082
      INTEGRATION_URL: http://integration:8080
      CORS_EXTRA_ORIGINS: http://localhost:5174
      RUST_LOG: info
    networks:
      - perfice
    depends_on:
      auth:
        condition: service_started
    restart: unless-stopped

  # Carries the two cross-service events: user.deleted and
  # user.timezone_changed. Queues and messages are durable, so an event
  # published while sync or integration is down is waiting when it returns --
  # which is what stops a deleted account's data from being left behind.
  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: perfice
      RABBITMQ_DEFAULT_PASS: CHANGE_ME
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - perfice
    healthcheck:
      # check_running alone passes before the listener accepts connections.
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped
