# Test-only infrastructure for the backend end-to-end suite.
#
# Deliberately does NOT use ../docker-compose.yml: that one pulls published
# ghcr images and has placeholder config. Here we only run the stateful
# dependencies; the services themselves are built from local source and run as
# host processes by harness/services.py so their logs can be captured.
#
# Mongo listens on the SAME port inside the container as it is published on, so
# a single "localhost:<port>" address is valid both inside the container and
# from the host. Without that the replica set member host would be unreachable
# from one side or the other. RabbitMQ advertises nothing, so a plain port
# mapping is enough for it.

services:
  mongo:
    image: mongo:7
    # Applying a sync update uses a transaction, which needs a replica set.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27117"]
    ports:
      - "27117:27117"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27117", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-alpine
    ports:
      - "5772:5672"
    healthcheck:
      # check_running alone passes before the listener accepts connections.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
