[package]
name = "perfice-integration"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
cron = "0.17.0"
futures = "0.3.33"
jsonschema = { version = "0.49.2", default-features = false }
mongodb = "3.8.0"
perfice-common = { version = "0.1.0", path = "../common" }
perfice-proto = { version = "0.1.0", path = "../proto" }
rand = "0.10.2"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_path = "0.7.2"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[lints]
workspace = true
