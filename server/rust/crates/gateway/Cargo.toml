[package]
name = "perfice-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
http = "1.5.0"
perfice-common = { version = "0.1.0", path = "../common" }
perfice-proto = { version = "0.1.0", path = "../proto" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"

[lints]
workspace = true
