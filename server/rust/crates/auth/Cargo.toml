[package]
name = "perfice-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures = "0.3.33"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
mongodb = "3.8.0"
perfice-common = { version = "0.1.0", path = "../common" }
perfice-proto = { version = "0.1.0", path = "../proto" }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4"] }

[lints]
workspace = true
