server {
    listen 80;
	server_name frontend;

	# Keep redirects relative. nginx would otherwise expand `/new/` into an
	# absolute URL using its own listen port (80), which is wrong the moment
	# the container is published on any other port or sits behind a proxy:
	# http://localhost:8080/new would bounce to http://localhost/new/.
	absolute_redirect off;

	location /new/ {
	    root /usr/share/nginx/html;
		try_files $uri @new;
	}

	# 302, not 301: browsers cache a permanent redirect indefinitely and stop
	# asking, so one bad Location (see above) survives every server-side fix
	# until the user clears their cache. Nothing here is worth that risk.
	location = /new {
		return 302 /new/;
	 }

	# Bare / would otherwise 404, since the app is served under /new/.
	location = / {
		return 302 /new/;
	 }

	location @new {
	    root /usr/share/nginx/html;
		rewrite ^(.+)$ /new/index.html;
	}
}